name: Actualizar perfil

on:
  schedule:
    - cron: "0 5 * * *" # todos los días a las 05:00 UTC
  workflow_dispatch: # botón "Run workflow" en la pestaña Actions
  push:
    branches: [main]
    paths-ignore: ["assets/neofetch.svg"]

permissions:
  contents: write

concurrency:
  group: perfil
  cancel-in-progress: true

jobs:
  serpiente:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generar serpiente de contribuciones
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#00ff41&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            dist/snake-light.svg?color_snake=#006d32

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar neofetch.svg
        env:
          # Opcional: crea un secret METRICS_TOKEN (PAT con read:user) para contar también tu actividad privada
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python .github/scripts/neofetch.py

      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/neofetch.svg
          git diff --cached --quiet || git commit -m "chore: actualizar stats del perfil"
          git push
